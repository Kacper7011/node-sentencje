<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Żądania do serwera</title>
</head>
<body>
  <h1>Żądania do serwera</h1>
  <p>
    <button type="button">/api/powitanie</button>
    <button type="button">/api/sentencje</button>
    <button type="button">/api/sentencje/0</button>
    <button type="button">/api/sentencje/999</button>
    <button type="button">/nie-ma</button>
  </p>
  <pre id="wynik" aria-live="polite">Kliknij przycisk.</pre>
  <script>
    const wynik = document.querySelector('#wynik');

    async function wyslij(adres) {
      const punkt1 = `1. przeglądarka: wysłano żądanie GET ${adres}\n`;
      wynik.textContent = punkt1;

      try {
        const odpowiedz = await fetch(adres, { cache: 'no-store' });
        const tresc = await odpowiedz.text();
        wynik.textContent = punkt1
          + `4. przeglądarka: odebrano odpowiedź, status ${odpowiedz.status}\n\n${tresc}`;
      } catch {
        wynik.textContent = punkt1 + 'Nie udało się odebrać odpowiedzi z serwera.';
      }
    }

    for (const przycisk of document.querySelectorAll('button')) {
      przycisk.addEventListener('click', () => wyslij(przycisk.textContent.trim()));
    }
  </script>
</body>
</html>
